name: Sync Homebrew Cask

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "Build and Release" ]
    types: [ completed ]

permissions:
  contents: write

jobs:
  update-homebrew-cask:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion
      == 'success'
    permissions:
      contents: write
    env:
      NATIVE_CASK_NAME: tray-link
      ELECTRON_CASK_NAME: tray-link-electron
      HOMEBREW_TAP_REPO: thejoaov/homebrew-tap
    steps:
      - name: Checkout source repo (for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest git tag
        id: latest_tag
        run: |
          set -euo pipefail

          git fetch --tags --force
          latest_tag=$(git tag --sort=-v:refname | head -n1)

          if [ -z "${latest_tag}" ]; then
            echo "Could not resolve latest git tag."
            exit 1
          fi

          echo "release_tag=${latest_tag}" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: release_version
        env:
          RELEASE_TAG: ${{ steps.latest_tag.outputs.release_tag }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#tray-link-v}"
          version="${version#v}"

          if [ -z "$version" ] || [ "$version" = "$RELEASE_TAG" ]; then
            echo "Could not parse version from tag: $RELEASE_TAG"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HOMEBREW_TAP_REPO }}
          token: ${{ secrets.PAT }}
          path: homebrew-tap

      - name: Update Cask files
        env:
          RELEASE_TAG: ${{ steps.latest_tag.outputs.release_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="${{ steps.release_version.outputs.version }}"
          tap_casks_dir="homebrew-tap/Casks"

          release_json=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}")

          echo "Available release assets for ${RELEASE_TAG}:"
          echo "$release_json" | jq -r '.assets[].name' || true

          resolve_asset_name() {
            local target="$1"
            local asset_name=""

            if [ "$target" = "native" ]; then
              asset_name=$(echo "$release_json" | jq -r '
                .assets[]
                | select(.name | test("(?i)tray[-_. ]?link[-_. ]?macos[-_. ]?universal"))
                | select(.name | test("(?i)\\.zip$"))
                | .name
              ' | head -n1)
            else
              asset_name=$(echo "$release_json" | jq -r '
                .assets[]
                | select(.name | test("(?i)tray[-_. ]?link"))
                | select(.name | test("(?i)darwin"))
                | select(.name | test("(?i)\\.zip$"))
                | select(.name | test("(?i)tray[-_. ]?link[-_. ]?macos[-_. ]?universal") | not)
                | .name
              ' | head -n1)

              if [ -z "${asset_name}" ] || [ "${asset_name}" = "null" ]; then
                asset_name=$(echo "$release_json" | jq -r '
                  .assets[]
                  | select(.name | test("(?i)darwin"))
                  | select(.name | test("(?i)\\.zip$"))
                  | select(.name | test("(?i)tray[-_. ]?link[-_. ]?macos[-_. ]?universal") | not)
                  | .name
                ' | head -n1)
              fi
            fi

            if [ -z "${asset_name}" ] || [ "${asset_name}" = "null" ]; then
              echo "Could not resolve ${target} macOS asset in release ${RELEASE_TAG}."
              exit 1
            fi

            printf '%s\n' "$asset_name"
          }

          resolve_asset_url() {
            local asset_name="$1"

            echo "$release_json" | jq -r --arg name "$asset_name" '
              .assets[]
              | select(.name == $name)
              | .browser_download_url
            '
          }

          resolve_asset_sha256() {
            local asset_url="$1"
            local target_file="$2"

            curl -L "$asset_url" -o "$target_file"
            shasum -a 256 "$target_file" | awk '{print $1}'
          }

          write_cask_file() {
            local cask_name="$1"
            local asset_url="$2"
            local sha256="$3"
            local arch_requirement="${4:-}"
            local install_cli_binary="${5:-false}"
            local cask_file="${tap_casks_dir}/${cask_name}.rb"

            {
              printf '%s\n' "cask \"${cask_name}\" do"

              if [ "$install_cli_binary" = "true" ]; then
                printf '%s\n' '  arch arm: "arm64", intel: "x64"'
                printf '\n'
              fi

              printf '%s\n' \
                "  version \"${version}\"" \
                "  sha256 \"${sha256}\"" \
                "" \
                "  url \"${asset_url}\"" \
                "  name \"Tray Link\"" \
                "  desc \"Manage your projects from the system tray\"" \
                "  homepage \"https://github.com/thejoaov/tray-link\""

              if [ -n "$arch_requirement" ]; then
                printf '\n%s\n' "  depends_on arch: :${arch_requirement}"
              fi

              printf '\n%s\n' "  app \"Tray Link.app\""

              if [ "$install_cli_binary" = "true" ]; then
                printf '%s\n' '  binary "#{appdir}/Tray Link.app/Contents/Resources/tlink-#{arch}", target: "tlink"'
              fi

              printf '\n%s\n' \
                "  zap trash: [" \
                "    \"~/Library/Application Support/Tray Link\"," \
                "    \"~/Library/Preferences/com.thejoaov.tray-link.plist\"," \
                "    \"~/Library/Caches/com.thejoaov.tray-link\"," \
                "    \"~/.tray-link\"," \
                "  ]" \
                "end"
            } > "$cask_file"
          }

          mkdir -p "$tap_casks_dir"

          native_asset_name=$(resolve_asset_name "native")
          native_asset_url=$(resolve_asset_url "$native_asset_name")
          native_sha256=$(resolve_asset_sha256 "$native_asset_url" native-release.zip)
          echo "Selected native macOS asset: ${native_asset_name}"
          write_cask_file "${NATIVE_CASK_NAME}" "$native_asset_url" "$native_sha256" "" "true"

          electron_asset_name=$(resolve_asset_name "electron")
          electron_asset_url=$(resolve_asset_url "$electron_asset_name")
          electron_sha256=$(resolve_asset_sha256 "$electron_asset_url" electron-release.zip)
          echo "Selected Electron macOS asset: ${electron_asset_name}"
          write_cask_file "${ELECTRON_CASK_NAME}" "$electron_asset_url" "$electron_sha256" "arm64"

      - name: Commit and push to Homebrew tap
        run: |
          set -euo pipefail
          cd homebrew-tap

          git config user.name "thejoaov"
          git config user.email "thejoaov@users.noreply.github.com"

          git add "Casks/${NATIVE_CASK_NAME}.rb" "Casks/${ELECTRON_CASK_NAME}.rb"

          if git diff --cached --quiet; then
            echo "No cask changes to commit"
            exit 0
          fi

          git commit -m "chore(cask): sync macOS casks ${{ steps.release_version.outputs.version }}"
          git push origin main
